name: CI - Code Quality & Validation

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Code Validation & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate HTML and JavaScript files
        run: |
          echo "Verifying project structure and critical files..."
          test -f index.html || { echo "index.html missing!"; exit 1; }
          test -f style.css || { echo "style.css missing!"; exit 1; }
          test -f app.js || { echo "app.js missing!"; exit 1; }
          test -f README.md || { echo "README.md missing!"; exit 1; }
          echo "All core files exist and are verified."

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          echo "JavaScript syntax valid."
